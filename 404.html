<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BoxHub - Không tìm thấy trang</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      font-family:Arial,sans-serif;color:#fff;text-align:center;
      background:linear-gradient(135deg,#120b25,#24104a,#3a1459);
    }
    .box{
      width:min(90%,520px);padding:40px 25px;border:1px solid #7d4bc4;
      border-radius:22px;background:rgba(20,10,40,.85);
      box-shadow:0 15px 50px rgba(0,0,0,.4);
    }
    h1{font-size:64px;margin:0 0 10px;color:#dca7ff}
    h2{margin:0 0 12px}
    p{color:#cfc5dc}
    a{
      display:inline-block;margin-top:15px;padding:12px 22px;border-radius:12px;
      background:#9b5de5;color:#fff;text-decoration:none;font-weight:bold;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <h2>Không tìm thấy trang</h2>
    <p>Trang bạn đang tìm không tồn tại trên BoxHub.</p>
    <a href="./">Quay về BoxHub</a>
  </div>
</body>
</html>
